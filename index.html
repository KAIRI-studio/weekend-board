  <style>

    *{box-sizing:border-box}html{background:var(--navy)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--paper);color:var(--ink);min-height:100dvh}body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .45s}body.full-photo:before{z-index:0;opacity:1;background-color:#100820;background-image:var(--full-wallpaper,url('theme-full.jpg'));background-position:center top;background-size:cover;background-repeat:no-repeat}body.full-photo:after{z-index:0;opacity:1;background:linear-gradient(180deg,rgba(10,5,22,.02),rgba(10,5,22,.07) 48%,rgba(10,5,22,.18))}
    button,input{font:inherit}.app{position:relative;z-index:1;max-width:520px;margin:auto;min-height:100dvh;padding-bottom:72px;background:var(--paper);transition:background .35s}
    header{position:relative;isolation:isolate;overflow:hidden;background:var(--navy) var(--hero,url('castor-hero.jpg')) center 18%/cover no-repeat;color:white;min-height:205px;padding:calc(env(safe-area-inset-top) + 20px) 18px 16px;border-radius:0 0 27px 27px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 12px 28px rgba(5,21,37,.18);transition:min-height .4s,background .4s,box-shadow .4s}
    header:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(3,15,28,.18) 0%,rgba(3,18,33,.12) 38%,rgba(3,18,33,.82) 100%)}
    header:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(4,20,36,.24),transparent 58%)}
    .theme-button{position:absolute;z-index:3;right:14px;top:calc(env(safe-area-inset-top) + 11px);border:1px solid rgba(255,255,255,.45);border-radius:999px;background:rgba(5,15,26,.42);backdrop-filter:blur(12px);color:white;padding:8px 12px;font-size:.7rem;font-weight:900;letter-spacing:.12em;box-shadow:0 5px 20px #0004}.eyebrow{font-size:.72rem;font-weight:900;letter-spacing:.2em;color:#ffd384;text-shadow:0 2px 8px #0008}h1{font-size:1.82rem;line-height:1;margin:5px 0 9px;letter-spacing:.015em;text-shadow:0 3px 16px #0009}.week{font-size:.82rem;color:#eef6fb;text-shadow:0 2px 8px #000b}
    .meter{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:8px}.track{height:6px;background:rgba(255,255,255,.28);border-radius:9px;overflow:hidden;box-shadow:inset 0 1px 2px #0005}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff9f1c,#ffd166);border-radius:9px;transition:width .35s;box-shadow:0 0 12px #ffb43baa}.count{font-size:.8rem;font-weight:900;text-shadow:0 2px 7px #000b}
    main{position:relative;isolation:isolate;overflow:hidden;padding:12px 14px}.section{position:relative;z-index:1;margin-bottom:12px}.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 3px 6px}.section-title{font-size:.75rem;letter-spacing:.13em;font-weight:900;color:#536176}.section-count{font-size:.75rem;color:#8b95a5}
    .ripple-layer{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}.water-ripple{position:absolute;width:24px;height:24px;border:1.5px solid rgba(23,106,154,.26);border-radius:50%;transform:translate(-50%,-50%) scale(.15);opacity:0;animation:waterRipple 3.4s cubic-bezier(.18,.55,.25,1) forwards}.water-ripple:after{content:"";position:absolute;inset:-1px;border:1px solid rgba(255,180,59,.12);border-radius:inherit;animation:rippleEcho 3.4s .42s cubic-bezier(.18,.55,.25,1) forwards}
    @keyframes waterRipple{0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}12%{opacity:.72}75%{opacity:.2}100%{opacity:0;transform:translate(-50%,-50%) scale(9)}}@keyframes rippleEcho{0%{opacity:0;transform:scale(.2)}12%{opacity:.7}100%{opacity:0;transform:scale(6.5)}}
    .list{display:grid;gap:4px}.task{display:grid;grid-template-columns:32px minmax(0,1fr) 27px;gap:3px;align-items:center;min-height:42px;background:rgba(255,255,255,.94);border:1px solid #e1e5e8;border-radius:13px;padding:4px 5px 4px 7px;box-shadow:0 3px 10px rgba(7,26,46,.06);transition:.22s;overflow:hidden}
    .check{width:26px;height:26px;border:2px solid #bac3d0;border-radius:8px;background:white;display:grid;place-items:center;color:transparent;padding:0}.task.done{opacity:.55;box-shadow:none}.task.done .check{border-color:var(--blue);background:var(--blue);color:white}.task.done .label{text-decoration:line-through}.label{font-size:1rem;font-weight:700;line-height:1.18}.more{border:0;background:transparent;color:#a0a8b5;font-size:1rem;padding:4px}

    .clear-toggle{width:100%;border:0;background:transparent;color:#657187;font-weight:800;padding:8px}.completed{display:none}.completed.open{display:grid}

    dialog{border:0;border-radius:25px;padding:0;width:min(calc(100% - 34px),450px);box-shadow:0 28px 80px #07152d66}dialog::backdrop{background:#07152db3;backdrop-filter:blur(3px)}.modal{padding:25px}.modal h2{margin:0 0 18px}.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;font-size:16px}.types{display:flex;gap:8px;margin-bottom:20px}.type{flex:1;border:1px solid var(--line);background:white;border-radius:12px;padding:10px;font-weight:700}.type.active{background:var(--navy);color:white}.actions{display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:14px;padding:13px;font-weight:800}.cancel{background:#edf0f5}.save{background:var(--yellow);color:var(--navy)}
    .theme-dialog{background:#0d1723;color:white}.theme-panel{padding:22px;max-height:min(82dvh,720px);overflow:auto}.theme-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.theme-panel h2{margin:0;font-size:1.2rem}.theme-close{width:36px;height:36px;border:0;border-radius:50%;background:#202d3b;color:white;font-size:1.2rem}.photo-add{width:100%;border:1px solid #ffca6a;border-radius:14px;background:linear-gradient(135deg,#ff9f1c,#ffc75a);color:var(--navy);font-weight:900;padding:12px;margin-bottom:7px}.photo-status{min-height:18px;margin:0 2px 9px;color:#bfc9d5;font-size:.72rem}.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.theme-card{position:relative;min-width:0}.theme-choice{width:100%;position:relative;border:2px solid transparent;border-radius:14px;overflow:hidden;padding:0;background:#182431;color:white;aspect-ratio:16/10}.theme-choice img{width:100%;height:100%;display:block;object-fit:cover}.theme-choice span{position:absolute;left:7px;bottom:7px;max-width:calc(100% - 14px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 7px;border-radius:8px;background:#071523b8;font-size:.66rem;font-weight:900;letter-spacing:.08em}.theme-choice.active{border-color:#ffb43b;box-shadow:0 0 0 2px #ffb43b44}.theme-choice.full img{object-position:center 22%}.photo-delete{position:absolute;z-index:2;right:6px;top:6px;width:27px;height:27px;border:1px solid #ffffff77;border-radius:50%;background:#071523c9;color:white;font-size:1rem;line-height:1;padding:0}.position-panel{margin-top:13px;padding:12px;border:1px solid #ffffff24;border-radius:14px;background:#ffffff0d}.position-panel label{display:flex;justify-content:space-between;margin-bottom:7px;font-size:.76rem;font-weight:800;letter-spacing:.08em}.position-panel input{width:100%;accent-color:var(--yellow)}
    .toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-120px);background:var(--navy);color:white;padding:12px 18px;border-radius:30px;font-weight:800;z-index:20;transition:.35s}.toast.show{transform:translate(-50%,0)}
    body.yuigahama-photo header{min-height:min(66.65vw,347px);background-size:100% auto;background-position:center top}
    body.full-photo:before{background-position:center var(--wallpaper-y,top)}body.full-photo:after{background:linear-gradient(180deg,transparent,rgba(10,5,22,.02) 55%,rgba(10,5,22,.07))}body.full-photo{background:#100820}body.full-photo .app{background-color:#100820;background-image:var(--full-wallpaper,url('theme-full.jpg'));background-position:center var(--wallpaper-y,top);background-size:cover;background-repeat:no-repeat}body.full-photo header{min-height:190px;background:transparent;box-shadow:none;border-radius:0}body.full-photo header:before{background:linear-gradient(180deg,rgba(8,3,20,.02),transparent 55%,rgba(8,3,20,.1))}body.full-photo header:after{background:linear-gradient(90deg,rgba(4,20,36,.08),transparent 62%)}body.full-photo main{background:transparent}body.full-photo .section-title,body.full-photo .section-count{color:white;text-shadow:0 2px 8px #000}body.full-photo .task{color:white;background:rgba(7,8,25,.08);border-color:rgba(255,255,255,.38);box-shadow:0 4px 14px rgba(7,2,20,.1);text-shadow:0 1px 5px #000}body.full-photo .check{color:transparent;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.78)}body.full-photo .task.done .check{color:white;background:rgba(23,106,154,.62)}body.full-photo .more{color:rgba(255,255,255,.9)}body.full-photo .empty{color:white;background:rgba(20,11,38,.07);border-color:rgba(255,255,255,.35)}body.full-photo .clear-toggle{color:white;text-shadow:0 2px 8px #000}body.full-photo .water-ripple{border-color:rgba(255,255,255,.35)}body.full-photo .fab{border-color:rgba(255,255,255,.65);background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(220,204,255,.34));box-shadow:0 8px 22px rgba(12,5,26,.2)}
    @media(min-width:700px){body{padding:24px}.app{border-radius:35px;overflow:hidden;min-height:calc(100dvh - 48px)}header{min-height:280px;padding-top:32px;background-position:center 18%}}

<body><div class="app">
  <header><button class="theme-button" id="themeButton">PHOTO</button><div class="eyebrow">CASTOR / WEEKEND</div><h1>WEEKEND BOARD</h1><div class="week" id="week"></div><div class="meter"><div class="track"><div class="fill" id="fill"></div></div><div class="count" id="totalCount">0 / 0</div></div></header>
  <main><div class="ripple-layer" id="rippleLayer" aria-hidden="true"></div><section class="section"><div class="section-head"><span class="section-title">WEEKEND MISSION</span><span class="section-count" id="routineCount"></span></div><div class="list" id="routine"></div></section>
  <section class="section"><div class="section-head"><span class="section-title">PROJECT</span><span class="section-count" id="projectCount"></span></div><div class="list" id="project"></div></section>
  <button class="clear-toggle" id="clearToggle">CLEARした項目を見る ↓</button><div class="list completed" id="completed"></div></main>
  <button class="fab" id="add">＋ ミッションを追加</button>
</div>
<dialog id="dialog"><form class="modal" id="form"><h2>ミッションを追加</h2><input class="field" id="taskName" maxlength="40" placeholder="やること" required><div class="types"><button type="button" class="type active" data-type="routine">毎週やる</button><button type="button" class="type" data-type="project">PROJECT</button></div><div class="actions"><button type="button" class="cancel" id="cancel">キャンセル</button><button class="save">追加する</button></div></form></dialog>
<dialog id="themeDialog" class="theme-dialog"><div class="theme-panel"><div class="theme-panel-head"><h2>PHOTO SELECT</h2><button class="theme-close" id="themeClose" aria-label="閉じる">×</button></div><button class="photo-add" id="photoAdd" type="button">＋ 自分の写真を追加</button><input id="photoInput" type="file" accept="image/*" hidden><p class="photo-status" id="photoStatus">縦写真を選ぶと背景に保存されます</p><div class="theme-grid" id="themeGrid"></div><div class="position-panel" id="positionPanel" hidden><label for="photoPosition"><span>写真の上下位置</span><span id="positionValue">50%</span></label><input id="photoPosition" type="range" min="0" max="100" value="50"></div></div></dialog><div class="toast" id="toast">WEEKEND CLEAR! ★</div>
<script>
const defaults=[['洗濯','routine'],['水換え','routine'],['トリミングうなじ','routine'],['TV録画','routine'],['月曜準備','routine'],['子供爪切り','routine'],['ソウタ スマホ充電','routine'],['エーペックス動画作成','project'],['ホームページ作成','project'],['エディケーショナルゲーム作成','project']];
const key='castor-weekend-v1';
const backupKey='castor-weekend-v1-backup';
const now=new Date();
const dateKey=date=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const saturday=new Date(now);saturday.setDate(now.getDate()-((now.getDay()+1)%7));
const weekendKey=dateKey(saturday);
const monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));
const legacyMondayKey=dateKey(monday);
const cycleMonday=new Date(saturday);cycleMonday.setDate(saturday.getDate()-5);
const cycleMondayKey=dateKey(cycleMonday);
function readSaved(storageKey){try{const value=JSON.parse(localStorage.getItem(storageKey)||'null');return value&&Array.isArray(value.tasks)?value:null}catch{return null}}
let data=readSaved(key)||readSaved(backupKey);
if(!data)data={week:weekendKey,tasks:defaults.map((x,i)=>({id:Date.now()+i,name:x[0],type:x[1],done:false}))};

// Restore only the two exact reset shapes produced by earlier releases.
const recoveryKey='castor-weekend-recovery-20260907d';
const signature=tasks=>tasks.map(t=>`${t.name}|${t.type}|${t.done?'1':'0'}`).sort().join('~');
const resetByWeek=[
 ['洗濯','routine',false],['水換え','routine',false],['トリミングうなじ','routine',false],['TV録画','routine',false],
 ['月曜準備','routine',false],['子供爪切り','routine',false],['ソウタ スマホ充電','routine',false],['昼ごはん','routine',false]
].map((x,i)=>({id:i,name:x[0],type:x[1],done:x[2]}));
const resetToDefault=defaults.map((x,i)=>({id:i,name:x[0],type:x[1],done:false}));
if(!localStorage.getItem(recoveryKey)&&(signature(data.tasks)===signature(resetByWeek)||signature(data.tasks)===signature(resetToDefault))){
 const recovered=[
  ['洗濯','routine',true],['水換え','routine',true],['トリミングうなじ','routine',true],['TV録画','routine',true],
  ['月曜準備','routine',true],['子供爪切り','routine',false],['ソウタ スマホ充電','routine',true],['昼ごはん','routine',true],
  ['アイテム立てるやつ','project',false],['断捨離','project',false],['テクノ準備','project',false],['春つば提出物','project',false],['亜鉛サプリ','project',false]
 ];
 data={week:weekendKey,tasks:recovered.map((x,i)=>({id:Date.now()+i,name:x[0],type:x[1],done:x[2]}))};
 localStorage.setItem(recoveryKey,'1');save();
}
// A new weekend starts on Saturday. Only weekly missions reset; projects persist.
// Migrate the current Monday-based key without resetting a second time.
const saturdayCycleKey='castor-weekend-saturday-cycle-v1';
if(!localStorage.getItem(saturdayCycleKey)&&(data.week===legacyMondayKey||data.week===cycleMondayKey)){
 data.week=weekendKey;localStorage.setItem(saturdayCycleKey,'1');save();
}else if(data.week!==weekendKey){
 data.tasks=data.tasks.map(t=>t.type==='routine'?{...t,done:false}:t);
 data.week=weekendKey;save();
}
let selected='routine'; const $=s=>document.querySelector(s);
const staticThemes=[
 {key:'static-0',name:'YUIGAHAMA',image:'castor-hero.jpg'},
 {key:'static-1',name:'HOT',image:'theme-group-1.jpg'},
 {key:'static-2',name:'GROUP',image:'theme-group-2.jpg'},
 {key:'static-3',name:'CHAEWON',image:'theme-solo-1.jpg'},
 {key:'static-4',name:'SAKURA',image:'theme-solo-2.jpg'},
 {key:'static-5',name:'VERTICAL 01',image:'theme-full.jpg',full:true,position:0},
 {key:'static-6',name:'VERTICAL 02',image:'theme-full-2.jpg',full:true,position:0},
 {key:'static-7',name:'VERTICAL 03',image:'theme-full-3.jpg',full:true,position:0}
];
let customThemes=[];
const legacySavedTheme=Number(localStorage.getItem('castor-weekend-theme')||0);
const fallbackThemeKey=`static-${Number.isInteger(legacySavedTheme)&&legacySavedTheme>=0&&legacySavedTheme<staticThemes.length?legacySavedTheme:0}`;
let currentThemeKey=localStorage.getItem('castor-weekend-theme-key')||fallbackThemeKey;
function save(){const current=localStorage.getItem(key);if(current)localStorage.setItem(backupKey,current);localStorage.setItem(key,JSON.stringify(data))}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(t){return `<div class="task ${t.done?'done':''}" data-id="${t.id}"><button class="check" aria-label="完了を切り替え">✓</button><div class="label">${esc(t.name)}</div><button class="more" aria-label="削除">×</button></div>`}
function render(){const active=data.tasks.filter(t=>!t.done),done=data.tasks.filter(t=>t.done);['routine','project'].forEach(type=>{const a=active.filter(t=>t.type===type);$('#'+type).innerHTML=a.length?a.map(card).join(''):'<div class="empty">今週はクリア。</div>';$('#'+type+'Count').textContent=`${a.length}件`});$('#completed').innerHTML=done.map(card).join('');const weekly=data.tasks.filter(t=>t.type==='routine'),weeklyDone=weekly.filter(t=>t.done),total=weekly.length,p=total?Math.round(weeklyDone.length/total*100):0;$('#fill').style.width=p+'%';$('#totalCount').textContent=`${weeklyDone.length} / ${total}`;$('#clearToggle').textContent=`CLEARした項目を見る（${done.length}）${$('#completed').classList.contains('open')?' ↑':' ↓'}`;bind();if(total&&weeklyDone.length===total){$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}}
function bind(){document.querySelectorAll('.task').forEach(el=>{el.querySelector('.check').onclick=()=>{const t=data.tasks.find(t=>t.id==el.dataset.id);t.done=!t.done;save();render()};el.querySelector('.more').onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!=el.dataset.id);save();render()}})}
const dates=['日','月','火','水','木','金','土']; $('#week').textContent=`${now.getMonth()+1}.${now.getDate()} ${dates[now.getDay()]} — 今週末の進み具合`;
$('#add').onclick=()=>{$('#dialog').showModal();setTimeout(()=>$('#taskName').focus(),80)};$('#cancel').onclick=()=>$('#dialog').close();
document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{selected=b.dataset.type;document.querySelectorAll('.type').forEach(x=>x.classList.toggle('active',x===b))});
$('#form').onsubmit=e=>{e.preventDefault();data.tasks.push({id:Date.now(),name:$('#taskName').value.trim(),type:selected,done:false});save();$('#taskName').value='';$('#dialog').close();render()};
$('#clearToggle').onclick=()=>{$('#completed').classList.toggle('open');render()};render();

const photoDb=()=>new Promise((resolve,reject)=>{const request=indexedDB.open('castor-weekend-photos',1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('wallpapers'))request.result.createObjectStore('wallpapers',{keyPath:'id'})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
async function photoStore(mode,action){const db=await photoDb();return new Promise((resolve,reject)=>{const tx=db.transaction('wallpapers',mode),store=tx.objectStore('wallpapers');let result;try{result=action(store)}catch(error){db.close();reject(error);return}tx.oncomplete=()=>{db.close();resolve(result&&'result'in result?result.result:result)};tx.onerror=()=>{db.close();reject(tx.error)};tx.onabort=()=>{db.close();reject(tx.error)}})}
const getPhotos=()=>photoStore('readonly',store=>store.getAll());
const putPhoto=photo=>photoStore('readwrite',store=>store.put(photo));
const removePhoto=id=>photoStore('readwrite',store=>store.delete(id));
const photoUrls=new Map();
function allThemes(){return [...staticThemes,...customThemes]}
function setPhotoStatus(message){$('#photoStatus').textContent=message}
function renderThemes(){
 $('#themeGrid').innerHTML=allThemes().map(t=>`<div class="theme-card"><button type="button" class="theme-choice ${t.full?'full':''} ${t.key===currentThemeKey?'active':''}" data-theme="${t.key}"><img src="${t.image}" alt=""><span>${esc(t.name)}</span></button>${t.custom?`<button type="button" class="photo-delete" data-delete="${t.id}" aria-label="${esc(t.name)}を削除">×</button>`:''}</div>`).join('');
 document.querySelectorAll('.theme-choice').forEach(button=>button.onclick=()=>{applyTheme(button.dataset.theme);if(!button.dataset.theme.startsWith('custom-'))$('#themeDialog').close()});
 document.querySelectorAll('.photo-delete').forEach(button=>button.onclick=async event=>{event.stopPropagation();const theme=customThemes.find(t=>String(t.id)===button.dataset.delete);if(!theme||!confirm('この写真を削除しますか？'))return;try{if(currentThemeKey===theme.key)applyTheme('static-0');await removePhoto(theme.id);await loadCustomThemes();setPhotoStatus('写真を削除しました')}catch{setPhotoStatus('写真を削除できませんでした')}});
 updatePositionControl();
}
function applyTheme(themeKey,persist=true){
 const theme=allThemes().find(t=>t.key===themeKey)||staticThemes[0];currentThemeKey=theme.key;
 const image=theme.custom?theme.image:`${theme.image}?v=custom-photo-1`;
 document.body.classList.toggle('full-photo',!!theme.full);document.body.classList.toggle('yuigahama-photo',theme.key==='static-0');
 document.body.style.setProperty('--wallpaper-y',`${theme.position??0}%`);document.body.style.setProperty('--full-wallpaper',`url('${image}')`);document.querySelector('header').style.setProperty('--hero',`url('${image}')`);
 if(persist){localStorage.setItem('castor-weekend-theme-key',theme.key);if(theme.key.startsWith('static-'))localStorage.setItem('castor-weekend-theme',Number(theme.key.split('-')[1]))}
 document.querySelectorAll('.theme-choice').forEach(button=>button.classList.toggle('active',button.dataset.theme===theme.key));updatePositionControl();
}
function updatePositionControl(){const theme=customThemes.find(t=>t.key===currentThemeKey),panel=$('#positionPanel');panel.hidden=!theme;if(theme){$('#photoPosition').value=theme.position??50;$('#positionValue').textContent=`${theme.position??50}%`}}
async function loadCustomThemes(preferredThemeKey=currentThemeKey){
 try{const records=await getPhotos();photoUrls.forEach(url=>URL.revokeObjectURL(url));photoUrls.clear();customThemes=records.sort((a,b)=>a.createdAt-b.createdAt).map((record,index)=>{const image=URL.createObjectURL(record.blob);photoUrls.set(record.id,image);return {...record,key:`custom-${record.id}`,name:record.name||`MY PHOTO ${String(index+1).padStart(2,'0')}`,image,full:true,custom:true,position:Number.isFinite(record.position)?record.position:50}});renderThemes();if(allThemes().some(t=>t.key===preferredThemeKey))applyTheme(preferredThemeKey,false);else applyTheme('static-0')}
 catch{customThemes=[];renderThemes();if(currentThemeKey.startsWith('custom-'))applyTheme('static-0');setPhotoStatus('端末の写真保存を読み込めませんでした')}
}
function resizePhoto(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{try{const longest=Math.max(image.naturalWidth,image.naturalHeight),scale=Math.min(1,2400/longest),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('convert')),'image/jpeg',.88)}catch(error){URL.revokeObjectURL(url);reject(error)}};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('load'))};image.src=url})}
$('#photoAdd').onclick=()=>$('#photoInput').click();
$('#photoInput').onchange=async event=>{const file=event.target.files&&event.target.files[0];event.target.value='';if(!file)return;setPhotoStatus('写真を追加しています…');try{const blob=await resizePhoto(file),id=`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,record={id,name:`MY PHOTO ${String(customThemes.length+1).padStart(2,'0')}`,blob,position:50,createdAt:Date.now()};await putPhoto(record);currentThemeKey=`custom-${id}`;localStorage.setItem('castor-weekend-theme-key',currentThemeKey);await loadCustomThemes();setPhotoStatus('追加しました。下のバーで上下位置を調整できます')}catch(error){setPhotoStatus(error&&error.name==='QuotaExceededError'?'保存容量が足りません':'この写真を追加できませんでした')}};
$('#photoPosition').oninput=event=>{const position=Number(event.target.value),theme=customThemes.find(t=>t.key===currentThemeKey);if(!theme)return;theme.position=position;$('#positionValue').textContent=`${position}%`;document.body.style.setProperty('--wallpaper-y',`${position}%`)};
$('#photoPosition').onchange=async()=>{const theme=customThemes.find(t=>t.key===currentThemeKey);if(!theme)return;try{await putPhoto({id:theme.id,name:theme.name,blob:theme.blob,position:theme.position,createdAt:theme.createdAt});setPhotoStatus('表示位置を保存しました')}catch{setPhotoStatus('表示位置を保存できませんでした')}};
$('#themeButton').onclick=()=>{$('#themeDialog').showModal();renderThemes()};$('#themeClose').onclick=()=>$('#themeDialog').close();
const startupThemeKey=currentThemeKey;renderThemes();if(startupThemeKey.startsWith('static-'))applyTheme(startupThemeKey,false);else{applyTheme(fallbackThemeKey,false);currentThemeKey=startupThemeKey}loadCustomThemes(startupThemeKey);
const appVersion='custom-photo-persist-1';fetch(`version.json?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()).then(v=>{localStorage.setItem('castor-weekend-app-version',v.version);if(v.version!==appVersion&&!location.search.includes(`v=${v.version}`))location.replace(`./?v=${encodeURIComponent(v.version)}`)}).catch(()=>{});
function nextRipple(){const delay=500+Math.random()*1100;setTimeout(()=>{const main=document.querySelector('main'),layer=$('#rippleLayer');if(!main||!layer)return;const rect=main.getBoundingClientRect();const visibleTop=Math.max(38,-rect.top+38);const visibleBottom=Math.min(main.scrollHeight-38,window.innerHeight-rect.top-95);const ripple=document.createElement('i');ripple.className='water-ripple';ripple.style.left=(8+Math.random()*84)+'%';ripple.style.top=(visibleBottom>visibleTop?visibleTop+Math.random()*(visibleBottom-visibleTop):Math.random()*main.scrollHeight)+'px';layer.appendChild(ripple);setTimeout(()=>{ripple.remove();nextRipple()},3500)},delay)}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)nextRipple();
</script></body></html>
